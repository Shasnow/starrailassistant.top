
name: 部署文档

on:
  push:
    branches:
      - main
    # 仅当以下文件/文件夹变化时才触发部署
    paths:
      - "src/**" # 页面、组件、文档内容、样式
      - "!src/data/games.ts" # 数据源配置，单独改动不触发部署
      - "public/**" # 静态资源（接口 JSON、图标等）
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "CNAME" # 构建时会复制进 dist
  workflow_dispatch: # 支持手动触发（不受 paths 限制）

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          # submodules: true

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          VITE_APP_API_BASE_URL: https://shasnow.top/s/api
        run: |-
          pnpm run build
          > dist/.nojekyll
          cp CNAME dist/

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 部署文档
          branch: gh-pages
          folder: dist
